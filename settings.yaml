app:
  name: python-ppa
  profile: ${APP_PROFILE:dev}

mongodb:
  # Kept in .env or the process environment; MONGO_URI is also supported.
  uri: ${mongoURI}
  database: ${MONGO_DB_NAME:ppa_database}
  options:
    appname: python-ppa
    maxPoolSize: 100
    minPoolSize: 0
    maxIdleTimeMS: 60000
    serverSelectionTimeoutMS: 5000
    connectTimeoutMS: 5000
    socketTimeoutMS: 10000
    waitQueueTimeoutMS: 5000
    timeoutMS: 15000
    retryReads: true
    retryWrites: true

framework:
  logging:
    enabled: ${FRAMEWORK_LOGS_ENABLED:false}
    level: ${FRAMEWORK_LOG_LEVEL:INFO}
